# CPU correctness only. No benchmarks. CUDA tests skip without a GPU.
name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CPU torch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run labeled source-tree CPU tests
        env:
          SZL_SOURCE_TREE_TESTS: "1"
          PYTHONPATH: torch-ext
        run: python -m pytest tests --tb=short
