# CPU correctness only. No benchmarks. CUDA tests skip without a GPU.
name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CPU torch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run labeled source-tree CPU tests
        env:
          SZL_SOURCE_TREE_TESTS: "1"
          PYTHONPATH: torch-ext
        run: python -m pytest tests --tb=short
