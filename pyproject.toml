[project]
name = "szl-receipt-attn"
version = "0.1.0"
description = "Original SZL Triton tiled fused attention with SHA3-256 receipts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
# This is a Hugging Face Kernel Hub source project, not a PyPI distribution.
# Org release policy classifies it as never-publish (the wheel is incomplete).
classifiers = ["Private :: Do Not Upload"]
authors = [
  { name = "Stephen P. Lutar Jr. / SZL Holdings" },
]
urls = { Homepage = "https://a-11-oy.com", Source = "https://github.com/szl-holdings/szl-receipt-attn", Repository = "https://github.com/szl-holdings/szl-receipt-attn" }

[tool.pytest.ini_options]
markers = [
  "kernels_ci: kernel-builder CI tests (keep the marked set under 60s)",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["torch-ext"]
